            - article [ref=e406]:
              - generic [ref=e407]:
                - heading "ctf-worker" [level=1] [ref=e408]
                - 'link "Permalink: ctf-worker" [ref=e409] [cursor=pointer]':
                  - /url: "#ctf-worker"
              - paragraph [ref=e412]:
                - text: A self-hosted, completely free
                - strong [ref=e413]: autonomous CTF challenge dispatcher
                - text: ": watches a challenge source (GitHub repository or local directory), stages each challenge, hands it to the"
                - link "Pi" [ref=e414] [cursor=pointer]:
                  - /url: https://github.com/badlogic/pi-mono
                - text: coding agent, watches the run, classifies the outcome (solved / fatal / recoverable), and
                - strong [ref=e415]: forces the agent to continue
                - text: until the challenge is solved or genuinely blocked. Status and results are published to Discord (optional).
              - blockquote [ref=e416]:
                - paragraph [ref=e417]: The dispatcher owns discovery and lifecycle; Pi owns solving. The dispatcher only intervenes when Pi terminates, and only enough to distinguish “continue” from “stop.”
              - generic [ref=e418]:
                - heading "Architecture" [level=2] [ref=e419]
                - 'link "Permalink: Architecture" [ref=e420] [cursor=pointer]':
                  - /url: "#architecture"
              - generic [ref=e423]:
                - code [ref=e425]: Challenge source (GitHub repo, polling + optional webhook) │ ▼ ┌───────────────────────────────┐ │ ctf-worker (systemd service) │ │ watcher → detector → stager │ │ SQLite state → Pi handoff │ │ exit/error classifier │ │ continuation forcing │ │ Discord reporter (optional) │ └───────────────┬───────────────┘ │ pi --mode json --session-id ctf-<jobId> (headless) ▼ Pi agent (workspace = staged challenge) │ stdout events / exit code ▼ ┌───────────────────────────────┐ │ SOLVED → done │ │ FATAL → stop + report │ │ UNSOLVED → CONTINUE loop │ ← “not solved is not failure” │ attempts exhausted → BLOCKED │ └───────────────────────────────┘
                - button "Copy code to clipboard" [ref=e427] [cursor=pointer]
              - paragraph [ref=e431]: "Key properties:"
              - list [ref=e432]:
                - listitem [ref=e433]:
                  - strong [ref=e434]: Stateless w.r.t. agent reasoning
                  - text: — the dispatcher never interprets the solution; it only manages lifecycle.
                - listitem [ref=e435]:
                  - strong [ref=e436]: Stateful in SQLite
                  - text: — every discovery, job, attempt, and published message is persisted; restarts lose nothing.
                - listitem [ref=e437]:
                  - strong [ref=e438]: Webhook is an optimization
                  - text: — polling is authoritative; a missed webhook only delays discovery.
                - listitem [ref=e439]:
                  - strong [ref=e440]: Per-challenge content identity
                  - text: — a challenge is (path + content fingerprint). A push that changes one challenge only creates one new job.
                - listitem [ref=e441]:
                  - strong [ref=e442]: “Not solved is not failure”
                  - text: — an agent that stops without a fatal condition is forced to continue with a nudge prompt, resuming the same Pi session (transcript + workspace preserved).
                - listitem [ref=e443]:
                  - strong [ref=e444]: Fatal vs recoverable classification
                  - text: — auth/quota/billing/infrastructure errors stop the job; ordinary failure-to-solve continues. Transient transport errors that Pi auto-recovered mid-run are ignored (they only count if the run actually died because of them).
              - generic [ref=e445]:
                - heading "Layout" [level=2] [ref=e446]
                - 'link "Permalink: Layout" [ref=e447] [cursor=pointer]':
                  - /url: "#layout"
              - generic [ref=e450]:
                - code [ref=e452]: "ctf-worker/ ├── src/ │ ├── index.ts entrypoint: wiring, recovery, shutdown │ ├── cli.ts status/jobs/show queries against the DB │ ├── config.ts env + .env file configuration │ ├── log.ts leveled logging (journald captures it) │ ├── types.ts ChallengeRef / ChallengeFile / RawFile │ ├── database/ │ │ ├── db.ts SQLite wrapper (challenges, jobs, messages, meta) │ │ └── schema.sql │ ├── sources/ │ │ ├── source.ts ChallengeSource abstraction + challenge grouping │ │ ├── github.ts GitHub trees API + raw file downloads │ │ └── local.ts local directory source (content-hashed revisions) │ ├── dispatcher/ │ │ ├── watcher.ts polling loop (+ webhook trigger hook) │ │ ├── webhook.ts GitHub webhook receiver (HMAC verified) │ │ ├── stager.ts immutable per-job workspace staging │ │ ├── lifecycle.ts job state machine + outcome application │ │ └── queue.ts concurrency-limited runner │ ├── agents/ │ │ ├── backend.ts AgentBackend abstraction │ │ ├── pi.ts PiBackend: headless pi, JSON events, timeouts │ │ ├── echo.ts deterministic fake backend for tests │ │ └── prompts.ts initial/continuation prompts, AGENTS.md rules │ ├── errors/ │ │ └── classifier.ts solved/fatal/continue/blocked classification │ └── publishers/ │ ├── publisher.ts Publisher interface + dedupe hash │ ├── discord.ts Discord webhook + log fallback publisher │ └── reporter.ts lifecycle events + status dashboard → Discord ├── test/ node:test suites (classifier, e2e lifecycle) ├── ctf-worker.service systemd unit └── env.example environment reference"
